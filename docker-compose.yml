version: '3.8'

# =============================================================================
# ALEX - Local Development Docker Compose
# =============================================================================
# This file is for LOCAL DEVELOPMENT ONLY.
# For production, use render.yaml with Render + Neon PostgreSQL + Upstash Redis.
# =============================================================================

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: alex-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: alex
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: ["postgres", "-c", "shared_preload_libraries=vector"]

  redis:
    image: redis:7-alpine
    container_name: alex-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API service for local development (uses hot reload)
  api-dev:
    build:
      context: .
      target: build-web
    container_name: alex-api-dev
    command: pnpm --filter apps/web run dev
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/alex?schema=public
      REDIS_URL: redis://redis:6379
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      AUTH_SECRET: dev-secret-change-in-production-min-32-chars
      ENCRYPTION_KEY: dev-encryption-key-change-in-production-32-chars
      AI_MODE: mock
      STORAGE_MODE: local
      STORAGE_LOCAL_ROOT: /app/uploads
      MAX_FILE_SIZE_MB: 50
      ALLOWED_FILE_TYPES: pdf,doc,docx,txt,md,csv,xls,xlsx,ppt,pptx,png,jpg,jpeg
      TESSERACT_PATH: /usr/bin/tesseract
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages:/app/packages
      - uploads_data:/app/uploads
      - /app/apps/web/node_modules
      - /app/apps/web/.next
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Worker service for local development
  worker-dev:
    build:
      context: .
      target: build-web
    container_name: alex-worker-dev
    command: sh -c "sleep 10 && npx tsx apps/web/src/worker/index.ts"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/alex?schema=public
      REDIS_URL: redis://redis:6379
      AUTH_SECRET: dev-secret-change-in-production-min-32-chars
      ENCRYPTION_KEY: dev-encryption-key-change-in-production-32-chars
      AI_MODE: mock
      STORAGE_MODE: local
      STORAGE_LOCAL_ROOT: /app/uploads
      MAX_FILE_SIZE_MB: 50
      ALLOWED_FILE_TYPES: pdf,doc,docx,txt,md,csv,xls,xlsx,ppt,pptx,png,jpg,jpeg
      TESSERACT_PATH: /usr/bin/tesseract
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages:/app/packages
      - uploads_data:/app/uploads
      - /app/apps/web/node_modules
      - /app/apps/web/.next
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  uploads_data: