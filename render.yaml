# Render Blueprint for ALEX AI-Powered ERP
# Deploy with: render blueprint apply --file render.yaml
# Or create services manually in Render dashboard using these settings

services:
  # ---------------------------------------------------------------------------
  # Web Service: Next.js API + SSR (full application)
  # ---------------------------------------------------------------------------
  - type: web
    name: alex-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerBuildTarget: runner-api
    plan: standard
    region: oregon
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: HOSTNAME
        value: "0.0.0.0"
      - key: NEXT_PUBLIC_APP_URL
        sync: false
        # Set in Render dashboard: https://your-app.onrender.com
      - key: NEXTAUTH_URL
        sync: false
        # Set in Render dashboard: https://your-app.onrender.com
      - key: AUTH_MODE
        value: local
      - key: NEXT_PUBLIC_AUTH_MODE
        value: local
      - key: AUTH_SECRET
        sync: false
        # Generate with: openssl rand -base64 32
      - key: DATABASE_URL
        sync: false
        # Neon pooled connection string from Neon dashboard
      - key: DIRECT_URL
        sync: false
        # Neon direct connection string for Prisma migrations
      - key: ENCRYPTION_KEY
        sync: false
        # Generate with: openssl rand -hex 32
        # MUST match previous effective key to decrypt existing data
      - key: AI_MODE
        value: nemotron
      # AI Provider keys (configure only the ones you use):
      # - key: NVIDIA_NEMOTRON_API_KEY
      #   sync: false
      # - key: NVIDIA_NEMOTRON_MODEL
      #   value: nvidia/nemotron-3-ultra
      # - key: NVIDIA_NEMOTRON_BASE_URL
      #   value: https://integrate.api.nvidia.com/v1
      # - key: OPENAI_API_KEY
      #   sync: false
      # - key: GOOGLE_GEMINI_API_KEY
      #   sync: false
      # - key: ANTHROPIC_API_KEY
      #   sync: false
      # - key: MISTRAL_API_KEY
      #   sync: false
      # - key: GROQ_API_KEY
      #   sync: false
      # - key: OPENROUTER_API_KEY
      #   sync: false
      # - key: TOGETHER_AI_API_KEY
      #   sync: false
      - key: STORAGE_MODE
        value: s3
      - key: S3_ENDPOINT
        sync: false
        # Cloudflare R2 endpoint: https://<account-id>.r2.cloudflarestorage.com
      - key: S3_REGION
        value: auto
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: STORAGE_BUCKET_DOCUMENTS
        value: documents
      - key: STORAGE_BUCKET_AVATARS
        value: avatars
      - key: STORAGE_BUCKET_RESOURCES
        value: resources
      - key: MAX_FILE_SIZE_MB
        value: "50"
      - key: ALLOWED_FILE_TYPES
        value: pdf,doc,docx,txt,md,csv,xls,xlsx,ppt,pptx,png,jpg,jpeg
      # Dropbox Integration (optional):
      # - key: DROPBOX_APP_KEY
      #   sync: false
      # - key: DROPBOX_APP_SECRET
      #   sync: false
      # - key: DROPBOX_REDIRECT_URI
      #   sync: false
      #   # Set to: https://your-app.onrender.com/api/storage/dropbox/callback
      # Email (optional):
      # - key: SMTP_HOST
      #   sync: false
      # - key: SMTP_PORT
      #   value: "587"
      # - key: SMTP_USER
      #   sync: false
      # - key: SMTP_PASSWORD
      #   sync: false
      # - key: EMAIL_FROM
      #   sync: false
      # Push Notifications (optional):
      # - key: VAPID_PUBLIC_KEY
      #   sync: false
      # - key: VAPID_PRIVATE_KEY
      #   sync: false
      # - key: VAPID_SUBJECT
      #   sync: false
    # Disk for persistent local storage (if STORAGE_MODE=local)
    # Requires a plan that supports disks
    # disk:
    #   name: alex-storage
    #   mountPath: /var/data/alex-storage
    #   sizeGB: 10

  # ---------------------------------------------------------------------------
  # Background Worker: Document processing, scheduled jobs
  # ---------------------------------------------------------------------------
  - type: worker
    name: alex-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerBuildTarget: runner-worker
    plan: starter
    region: oregon
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: AI_MODE
        value: nemotron
      # AI Provider keys (same as web service):
      # - key: NVIDIA_NEMOTRON_API_KEY
      #   sync: false
      # - key: OPENAI_API_KEY
      #   sync: false
      # - key: GOOGLE_GEMINI_API_KEY
      #   sync: false
      # - key: ANTHROPIC_API_KEY
      #   sync: false
      - key: STORAGE_MODE
        value: s3
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: STORAGE_BUCKET_DOCUMENTS
        value: documents
      - key: STORAGE_BUCKET_AVATARS
        value: avatars
      - key: STORAGE_BUCKET_RESOURCES
        value: resources
      - key: MAX_FILE_SIZE_MB
        value: "50"
      - key: ALLOWED_FILE_TYPES
        value: pdf,doc,docx,txt,md,csv,xls,xlsx,ppt,pptx,png,jpg,jpeg
      # Dropbox (optional):
      # - key: DROPBOX_APP_KEY
      #   sync: false
      # - key: DROPBOX_APP_SECRET
      #   sync: false
      # - key: DROPBOX_REDIRECT_URI
      #   sync: false
      # Email (optional):
      # - key: SMTP_HOST
      #   sync: false
      # - key: SMTP_PORT
      #   value: "587"
      # - key: SMTP_USER
      #   sync: false
      # - key: SMTP_PASSWORD
      #   sync: false
      # - key: EMAIL_FROM
      #   sync: false
    # Disk for persistent local storage (if STORAGE_MODE=local)
    # disk:
    #   name: alex-worker-storage
    #   mountPath: /var/data/alex-storage
    #   sizeGB: 10

