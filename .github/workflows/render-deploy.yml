name: Render Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

permissions:
  contents: read
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/alex-web

jobs:
  # ---------------------------------------------------------------------------
  # Lint & Typecheck
  # ---------------------------------------------------------------------------
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm run lint

      - name: Run typecheck
        run: pnpm run typecheck

  # ---------------------------------------------------------------------------
  # Tests
  # ---------------------------------------------------------------------------
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: alex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        command: ["postgres", "-c", "shared_preload_libraries=vector"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @alex/web run db:generate

      - name: Run tests
        run: pnpm run test:coverage
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/alex_test
          NODE_ENV: test

  # ---------------------------------------------------------------------------
  # Run Prisma Migrations (before deployment) - AUTHORITATIVE MIGRATION RUNNER
  # ---------------------------------------------------------------------------
  migrate:
    name: Run Prisma Migrations
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @alex/web run db:generate

      - name: Validate NEON_DIRECT_URL secret
        run: |
          if [ -z "${{ secrets.NEON_DIRECT_URL }}" ]; then
            echo "::error::NEON_DIRECT_URL secret is not set"
            exit 1
          fi
          echo "NEON_DIRECT_URL is configured"

      - name: Run Prisma migrations against Neon
        id: migrate
        run: |
          cd apps/web
          pnpm run db:migrate:deploy
        env:
          DATABASE_URL: ${{ secrets.NEON_DIRECT_URL }}
          DIRECT_URL: ${{ secrets.NEON_DIRECT_URL }}

      - name: Verify required tables exist after migration
        run: |
          cd apps/web
          node -e "
          const { PrismaClient } = require('@prisma/client');
          const prisma = new PrismaClient();
          async function verify() {
            try {
              // Check V2 required tables (documents, document_chunks, study_material_jobs)
              // Also check legacy tables for backward compatibility
              const v2Tables = await prisma.\$queryRaw\`
                SELECT table_name FROM information_schema.tables 
                WHERE table_schema = 'public' 
                AND table_name IN ('documents', 'document_chunks', 'study_material_jobs')
              \`;
              const legacyTables = await prisma.\$queryRaw\`
                SELECT table_name FROM information_schema.tables 
                WHERE table_schema = 'public' 
                AND table_name IN ('question_analyses', 'question_priority_items', 'question_analysis_items', 'question_papers', 'extracted_questions', 'generated_practice_papers')
              \`;
              
              const v2Existing = new Set(v2Tables.map(t => t.table_name));
              const legacyExisting = new Set(legacyTables.map(t => t.table_name));
              
              const v2Required = ['documents', 'document_chunks', 'study_material_jobs'];
              const legacyRequired = ['question_analyses', 'question_priority_items', 'question_analysis_items', 'question_papers', 'extracted_questions', 'generated_practice_papers'];
              
              const v2Missing = v2Required.filter(t => !v2Existing.has(t));
              const legacyMissing = legacyRequired.filter(t => !legacyExisting.has(t));
              
              if (v2Missing.length > 0) {
                console.error('MISSING V2 TABLES:', v2Missing.join(', '));
                process.exit(1);
              }
              if (legacyMissing.length > 0) {
                console.warn('MISSING LEGACY TABLES (expected for fresh installs):', legacyMissing.join(', '));
              }
              console.log('All required V2 tables exist:', v2Required.join(', '));
              console.log('Legacy tables present:', Array.from(legacyExisting).join(', ') || 'none');

              // Check migration status
              try {
                const migrations = await prisma.\$queryRaw\`
                  SELECT migration_name, finished_at, rolled_back_at 
                  FROM _prisma_migrations 
                  ORDER BY finished_at DESC
                  LIMIT 10
                \`;
                console.log('Recent migrations:');
                for (const m of migrations) {
                  const status = m.rolled_back_at ? 'ROLLED BACK' : (m.finished_at ? 'APPLIED' : 'PENDING');
                  console.log('  -', m.migration_name, ':', status, m.finished_at ? 'at ' + m.finished_at : '');
                }
              } catch (e) {
                console.warn('Could not read _prisma_migrations:', e.message);
              }
            } catch (e) {
              console.error('Verification failed:', e.message);
              process.exit(1);
            } finally {
              await prisma.\$disconnect();
            }
          }
          verify();
          "
        env:
          DATABASE_URL: ${{ secrets.NEON_DIRECT_URL }}
          DIRECT_URL: ${{ secrets.NEON_DIRECT_URL }}

  # ---------------------------------------------------------------------------
  # Build Docker Image
  # ---------------------------------------------------------------------------
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: migrate
    outputs:
      image-digest: ${{ steps.build-api.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for API image
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push API image
        id: build-api
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: runner-api
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for Worker image
        id: meta-worker
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-worker
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Worker image
        id: build-worker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: runner-worker
          push: true
          tags: ${{ steps.meta-worker.outputs.tags }}
          labels: ${{ steps.meta-worker.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Deploy to Render
  # ---------------------------------------------------------------------------
  deploy-render:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    environment: ${{ github.event.inputs.environment || 'production' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Render
        uses: render/action-deploy@v1
        with:
          serviceId: ${{ secrets.RENDER_SERVICE_ID }}
          apiKey: ${{ secrets.RENDER_API_KEY }}
          # Wait for deployment to complete
          waitForDeployment: true
          # Optional: specify branch or commit
          # branch: main

      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ./cloudflare-worker
          command: deploy --config wrangler.toml

      - name: Notify Deployment Status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ job.status }}';
            const env = '${{ github.event.inputs.environment || "production" }}';
            const runUrl = '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}';
            const body = `## 🚀 Render Deployment ${status === 'success' ? 'Succeeded' : 'Failed'}\n\nEnvironment: ${env}\nRun: ${runUrl}`;
            if (github.context.eventName === 'workflow_dispatch') {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: 1, // Create an issue or use another notification method
                body,
              });
            }

  # ---------------------------------------------------------------------------
  # Security Audit
  # ---------------------------------------------------------------------------
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run npm audit
        run: pnpm audit --audit-level=high
        continue-on-error: true

      - name: Check for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD
        continue-on-error: true